<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Discover apps from GoateyDev.">
    <meta name="theme-color" content="#f4f1e9">
    <title>GoateyDev | Apps with a clear purpose</title>
    <script>
      (() => {
        const validThemes = ["system", "light", "dark"];
        let theme = "system";
        try {
          const savedTheme = localStorage.getItem("goateydev-theme");
          if (validThemes.includes(savedTheme)) theme = savedTheme;
        } catch {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4f1e9;
        --ink: #20231f;
        --muted: #686b63;
        --line: #d4d2c8;
        --accent: #d35435;
        --accent-dark: #a53c26;
        --serif: Georgia, "Times New Roman", serif;
        --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --paper: #000;
        --ink: #f4f1e9;
        --muted: #aaa9a2;
        --line: #343434;
        --accent: #f0785d;
        --accent-dark: #ff9a7e;
      }

      @media (prefers-color-scheme: dark) {
        :root[data-theme="system"] {
          color-scheme: dark;
          --paper: #000;
          --ink: #f4f1e9;
          --muted: #aaa9a2;
          --line: #343434;
          --accent: #f0785d;
          --accent-dark: #ff9a7e;
        }
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      a { color: inherit; }

      .page {
        width: min(100% - 48px, 1160px);
        margin-inline: auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 88px;
        border-bottom: 1px solid var(--line);
      }

      .theme-control {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .theme-select {
        min-height: 38px;
        padding: 7px 30px 7px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
      }

      .theme-select:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.015em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        aspect-ratio: 1;
        place-items: center;
        border: 1px solid var(--ink);
        border-radius: 50%;
        color: var(--accent);
        font-family: var(--serif);
        font-size: 21px;
        line-height: 1;
      }

      .eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      main { padding-block: clamp(64px, 11vw, 142px) 96px; }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(180px, 0.48fr);
        gap: 48px;
        align-items: end;
      }

      h1 {
        max-width: 760px;
        margin: 22px 0 0;
        font-family: var(--serif);
        font-size: clamp(58px, 9vw, 116px);
        font-weight: 400;
        letter-spacing: -0.065em;
        line-height: 0.94;
      }

      h1 span { color: var(--accent); }

      .intro {
        max-width: 310px;
        margin: 0 0 6px auto;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.65;
      }

      .apps {
        margin-top: clamp(76px, 12vw, 142px);
        border-top: 1px solid var(--line);
      }

      .apps-heading {
        display: flex;
        justify-content: space-between;
        padding-block: 22px;
      }

      .app-row {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr) auto;
        gap: 20px;
        align-items: center;
        padding: 24px 0;
        border-top: 1px solid var(--line);
      }

      .app-icon {
        display: grid;
        width: 64px;
        aspect-ratio: 1;
        place-items: center;
        border-radius: 18px;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--serif);
        font-size: 35px;
      }

      .app-name {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(24px, 4vw, 32px);
        font-weight: 400;
        letter-spacing: -0.035em;
      }

      .app-description {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .app-link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 0 12px 12px;
        color: var(--accent-dark);
        font-size: 14px;
        font-weight: 700;
        text-decoration-thickness: 1px;
        text-underline-offset: 5px;
      }

      .app-link:focus-visible,
      .brand:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 5px;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding-block: 24px 32px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }

      footer a { text-underline-offset: 3px; }

      @media (max-width: 680px) {
        .page { width: min(100% - 36px, 1160px); }
        header { min-height: 72px; }
        .hero { grid-template-columns: 1fr; gap: 26px; }
        h1 { max-width: 560px; }
        .intro { margin: 0; }
        .app-row { grid-template-columns: 52px minmax(0, 1fr); gap: 15px; }
        .app-icon { width: 52px; border-radius: 15px; font-size: 29px; }
        .app-link { grid-column: 2; justify-self: start; padding: 4px 0; }
        footer { flex-direction: column; gap: 8px; }
      }

      @media (prefers-reduced-motion: no-preference) {
        main { animation: arrive 550ms ease-out both; }
        @keyframes arrive {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="brand" href="/" aria-label="GoateyDev home">
          <span class="brand-mark" aria-hidden="true">g</span>
          <span>GoateyDev</span>
        </a>
        <label class="theme-control">
          <span class="eyebrow">Theme</span>
          <select class="theme-select" id="theme-select" aria-label="Theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </header>

      <main>
        <section class="hero" aria-labelledby="page-title">
          <div>
            <p class="eyebrow">Made by GoateyDev</p>
            <h1 id="page-title">Useful apps.<br><span>Clear purpose.</span></h1>
          </div>
          <p class="intro">A growing collection of thoughtful tools for everyday life.</p>
        </section>

        <section class="apps" aria-labelledby="apps-title">
          <div class="apps-heading">
            <h2 id="apps-title" class="eyebrow">Our apps</h2>
            <p class="eyebrow">01</p>
          </div>
          <article class="app-row">
            <div class="app-icon" aria-hidden="true">R</div>
            <div>
              <h3 class="app-name">Reminders</h3>
              <p class="app-description">A simple way to keep track of what matters.</p>
            </div>
            <a class="app-link" href="https://play.google.com/store/apps/details?id=goateydev.reminders">
              View on Google Play <span aria-hidden="true">↗</span>
            </a>
          </article>
        </section>
      </main>

      <footer>
        <span>© GoateyDev</span>
        <nav aria-label="Policies and contact">
          <a href="/privacy.html">Privacy</a>
          <a href="/terms.html">Terms</a>
          <a href="mailto:goateydev@gmail.com">Contact GoateyDev</a>
        </nav>
      </footer>
    </div>
    <script>
      (() => {
        const root = document.documentElement;
        const selector = document.querySelector("#theme-select");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)");

        function updateThemeColor() {
          const dark = root.dataset.theme === "dark"
            || (root.dataset.theme === "system" && systemDark.matches);
          document.querySelector('meta[name="theme-color"]').content = dark ? "#000000" : "#f4f1e9";
        }

        selector.value = root.dataset.theme;
        updateThemeColor();
        selector.addEventListener("change", () => {
          root.dataset.theme = selector.value;
          try {
            localStorage.setItem("goateydev-theme", selector.value);
          } catch {}
          updateThemeColor();
        });
        systemDark.addEventListener("change", () => {
          if (root.dataset.theme === "system") updateThemeColor();
        });
      })();
    </script>
  </body>
</html>
